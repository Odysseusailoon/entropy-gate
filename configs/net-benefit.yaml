# All gate/sampler/cache/batch/threshold choices freeze BEFORE development calibration.
# Formal study: Qwen3-8B on H200. The 1.7B/A100 profile is for debugging only.
model:
  name: Qwen/Qwen3-8B
run:
  name: net-benefit
  stage: pilot
sampling:
  seed_base: 20260907
  max_new_tokens: 1024
backend:
  name: hf
  device: cuda:0
  dtype: bfloat16
  attention: sdpa
  batch_size: 8
data:
  n_questions: 50
  question_offset: 1000
study:
  required_gpu_name: H200
  iid_budgets: [16, 32, 64]
  replicates: 10
  roots: 8
  prefix_tokens: 64
  beta: 1.0
  n_min: 1
  dev_split: train
  dev_offset: 8
  dev_questions: 10
  dev_replicates: 3
  candidates: [8, 16, 32, 48, 64, 96, 128]
  epsilon_js: [0.01, 0.02, 0.05]
  bootstrap_samples: 2000
  reference_max_samples: 4096
reference:
  n_ref: 1024
  convergence_grid: [128, 256, 512, 1024]
  convergence_js_threshold: 0.01
